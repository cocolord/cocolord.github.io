<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>骑序 · PedalState</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          sans-serif;
        color: #15251d;
        background: #f3f7f4;
      }
      body {
        margin: 0;
      }
      main {
        box-sizing: border-box;
        display: grid;
        align-content: center;
        max-width: 880px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 56px 24px;
      }
      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(3rem, 11vw, 7rem);
        letter-spacing: -0.06em;
        line-height: 0.95;
      }
      .english {
        display: block;
        margin-top: 14px;
        color: #267348;
        font-size: 0.45em;
        letter-spacing: -0.03em;
      }
      .tagline {
        max-width: 600px;
        margin: 32px 0 0;
        font-size: clamp(1.25rem, 3vw, 1.8rem);
        line-height: 1.45;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 36px;
      }
      a {
        padding: 12px 18px;
        border: 1px solid #93bca2;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e9f4ed;
          background: #101813;
        }
        .english {
          color: #75d49b;
        }
        a {
          border-color: #416c50;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>骑序<span class="english">PedalState</span></h1>
      <p class="tagline">
        今天怎么骑。基于 Apple 健康中已有的骑行与恢复数据，在 iPhone 本地生成可解释的训练建议。
      </p>
      <nav aria-label="产品链接">
        <a href="support/">支持</a>
        <a href="privacy/">隐私政策</a>
      </nav>
    </main>
  </body>
</html>
